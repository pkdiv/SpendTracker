name: Build and Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.12.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Tags are the source of truth for the version. Fail explicitly rather than
      # uploading an artifact whose versionCode can't be traced back to a release.
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$version' is not X.Y.Z (from the tag or workflow_dispatch input)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test bundleRelease assembleRelease --no-daemon -PversionName=${{ steps.version.outputs.version }}

      # Versioned release for a pushed tag or a manual dispatch with a version.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          aab=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$aab" "spend-tracker-$tag.aab"
          cp "$apk" "spend-tracker-$tag.apk"
          gh release delete "$tag" --yes || true
          gh release create "$tag" \
            "spend-tracker-$tag.aab" \
            "spend-tracker-$tag.apk" \
            --target "$GITHUB_SHA" \
            --generate-notes
