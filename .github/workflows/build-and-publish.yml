name: Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test assembleRelease --no-daemon

      # Versioned release for an explicit version tag (e.g. v0.1.3).
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "${{ github.ref_name }}.apk"
          gh release delete "${{ github.ref_name }}" --yes || true
          gh release create "${{ github.ref_name }}" \
            "${{ github.ref_name }}.apk" \
            --generate-notes

      # Rolling prerelease so every push to main produces a downloadable app.
      # Kept as a prerelease so the newest version tag keeps the "Latest" badge.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="main-latest"
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "spend-tracker-main.apk"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" \
            "spend-tracker-main.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Main build ${GITHUB_SHA:0:7}" \
            --notes "Rolling prerelease built from ${GITHUB_SHA}."
